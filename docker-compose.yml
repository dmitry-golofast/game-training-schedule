services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventfit-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - media:/app/media
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - eventfit-net

  mongo:
    image: mongo:7
    container_name: eventfit-mongo
    restart: unless-stopped
    command: ['--storageEngine', 'wiredTiger']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventfit-net

  nginx:
    image: nginx:alpine
    container_name: eventfit-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot-web:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - eventfit-net

  certbot:
    image: certbot/certbot
    container_name: eventfit-certbot
    volumes:
      - certbot-web:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ['/bin/sh', '-c']
    command: ['trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done']
    networks:
      - eventfit-net

volumes:
  mongo-data:
  media:
  certbot-web:
  certbot-certs:

networks:
  eventfit-net:
    driver: bridge
