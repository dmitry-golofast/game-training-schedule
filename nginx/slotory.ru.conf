# ─── HTTP → HTTPS redirect + Let's Encrypt challenge ────────────
server {
    listen 80;
    server_name slotory.ru www.slotory.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS reverse proxy ───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name slotory.ru www.slotory.ru;

    # SSL certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/slotory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slotory.ru/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upload size (documents, media)
    client_max_body_size 10m;

    # Proxy to Next.js app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # WebSocket support (Payload admin, Next.js)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
