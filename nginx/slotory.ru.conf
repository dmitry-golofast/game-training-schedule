# ─── HTTP-only bootstrap (before SSL is obtained) ─────────────
# After SSL is obtained via ./deploy-ssl.sh, replace this file
# with the SSL version (slotory.ru.ssl.conf).

# ── slotory.ru → landing page ──
server {
    listen 80;
    server_name slotory.ru www.slotory.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Next.js app (landing at /)
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ── app.slotory.ru → redirect to /login ──
server {
    listen 80;
    server_name app.slotory.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Root → /login
    location = / {
        return 302 /login;
    }

    # Everything else → proxy to app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
